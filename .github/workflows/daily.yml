name: 💰 Daily cash-machine

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 6 * * *"   # article n°1 à 06h07 UTC
    - cron: "7 18 * * *"  # article n°2 à 18h07 UTC (vélocité x2)
  workflow_dispatch: {}    # bouton "Run" manuel possible

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances build
        run: pip install "openpyxl==3.1.5" "Pillow==10.4.0" "dukpy==0.6.0"
      - name: Tests unitaires (bloque si echec)
        run: python -m unittest discover -s tests
      - name: Publier 1 article + rebuild
        run: |
          python daily.py
      - name: Commit auto
        run: |
          git config user.name "cash-bot"
          git config user.email "cash-bot@users.noreply.github.com"
          git add -A
          git commit -m "auto: article du jour $(date -u +%F)" || echo "rien à commiter"
          git push
      - name: Déployer sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
